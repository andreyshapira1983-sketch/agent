name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + supply-chain guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks scans past commits, not just the latest diff

      - name: Secret scan (gitleaks)
        # Scans git history + diffs for leaked credentials (OpenAI, Anthropic,
        # AWS, GitHub PATs, PEM/private keys, …). Orthogonal to the other gates:
        # audit_release checks the release manifest/deps and core/secret_scanner
        # scans runtime content — neither inspects commit history. Fails the
        # build on any finding. Placed first so a leak fails fast.
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2 for `pull_request` events — the
          # action reads the PR's commit range through the API. Without it the
          # job dies at this step with "GITHUB_TOKEN is now required to scan
          # pull requests", which is why this workflow had only ever gone green
          # on direct pushes to main. This is the automatic per-run token, not a
          # stored secret: nothing to configure, and it expires with the job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hash-locked dependencies
        # --require-hashes fails the build if any dependency is not pinned with
        # a verified hash in requirements.lock (generated by pip-compile
        # --generate-hashes). This is the "hash-locked dependencies" guarantee.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Verify dependency tree is consistent
        # Fails if the installed set has conflicting or missing dependencies.
        run: pip check

      - name: Verify SBOM is in sync
        # Fails if sbom.cdx.json drifts from requirements.lock, keeping the
        # software bill of materials honest on every change.
        run: python scripts/generate_sbom.py --check

      - name: Release / supply-chain gate
        # Deterministic, no API keys required. Exits non-zero if the release
        # manifest leaks local secrets or the supply-chain audit fails.
        run: python scripts/audit_release.py

      - name: Install optional HTTP-server extra (test-only)
        # `api/server.py` imports fastapi, and `tests/test_api_server.py` has no
        # importorskip — so on a clean runner those two tests ERROR rather than
        # skip. fastapi is deliberately OUT of the hash-locked core set
        # (`requirements.in` says so at the top); installing it here honours that
        # decision while still exercising the HTTP surface. Operator's call on
        # PR #178: run the real check, not a skipped one.
        #
        # Placed AFTER every supply-chain gate on purpose. `pip check`, the SBOM
        # check and `audit_release.py` all describe the hash-locked set, and this
        # extra must not appear in what they measure. The re-run of `pip check`
        # below is the safety net: if the extra ever disturbs a pinned
        # dependency, CI says so here instead of failing obscurely in a test.
        #
        # Pinned to the version the operator runs locally, so a green CI and a
        # green workstation mean the same thing. uvicorn is not installed: the
        # tests import the app, they never serve it.
        run: |
          pip install "fastapi==0.136.1"
          pip check

      - name: Run tests with branch coverage
        # Operator decision (PR #178): the suite runs WITH real credentials,
        # not in offline mock mode. Two reasons, both measured:
        #
        #  1. `AGENT_ALLOW_MOCK_ROUTING=1` cannot work here — `tests/conftest.py`
        #     (`_neutralize_operator_model_env`) deletes that variable before
        #     every test on purpose, so routing assertions cannot inherit the
        #     ambient shell. Supplying a credential is the only way the suite
        #     reaches the same state a real operator runs in.
        #  2. It costs nothing. No test constructs a real provider client
        #     (no `anthropic.Anthropic(`, `OpenAI(` or `httpx.post` anywhere
        #     under `tests/`); the credential is only read by
        #     `core/model_router._provider_has_credentials` so `AgentLoop` can
        #     be built. Verified locally: a full run with live keys left
        #     `data/model_usage.jsonl` untouched.
        #
        # An absent secret expands to an empty string, which
        # `_provider_has_credentials` already treats as "no credential" — so a
        # fork PR (which GitHub denies secrets to) behaves exactly as before
        # rather than failing in a new way.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: coverage run --branch -m pytest

      - name: Coverage report (fail under threshold)
        # Enforces the minimum branch-coverage bar; fails the build below 85%.
        run: coverage report --fail-under=85
