---
# Codacy configuration for this repository.
#
# Why this file exists: the Codacy Security Scan workflow was failing with
#
#     Exception in thread "main"
#     java.nio.charset.MalformedInputException: Input length = 1
#
# and exit code 1, so no SARIF was ever uploaded. The stack trace names the
# exact caller:
#
#     com.codacy.analysis.cli.formatter.Sarif.createResults(Sarif.scala:146)
#       -> better.files.File.lines -> java.nio.file.Files.readAllLines
#
# so the crash is not in any analyser: it is the SARIF writer re-reading a
# file that already produced a result, to quote the offending line. One
# tracked file is not text at all -- docs/Технический_анализ_...docx, 204 KB
# whose first bytes are "PK\x03\x04", i.e. a ZIP container; byte 10 is 0xb7,
# which cannot start a UTF-8 sequence. Of 627 tracked files that is the only
# one that fails to decode, so keeping it out of the analysis is enough.
#   ^^^ REFUTED 2026-08-02: run 30744074248 -- a checkout with the .docx
#   already untracked -- crashed with the identical stack at the identical
#   site. The .docx was never the trigger (no analyser ever flagged it, and
#   only flagged files are re-read). The writer dies on ordinary UTF-8
#   sources whose flagged lines carry Cyrillic, i.e. most of this
#   repository; that is why the workflow failed 102 times out of 102 and
#   was removed the same day. The excludes below are kept: they are valid
#   for Codacy's cloud analysis, and binaries stay out of git regardless.
#
# Locale was ruled out by running their own image: codacy/codacy-analysis-cli
# already ships LANG=C.UTF-8 and file.encoding=UTF-8, and the wrapper script
# forwards only CODACY_CODE / CODACY_PROJECT_TOKEN / CODACY_API_TOKEN /
# CODACY_API_BASE_URL into the container -- job-level LANG or
# JAVA_TOOL_OPTIONS never reach the JVM at all. (2026-08-02: that same
# forwarding gap is what makes the crash unfixable from this side -- no
# encoding setting we write here or in the workflow ever reaches their JVM.)
#
# Both spellings are listed on purpose: "**/*.docx" only matches inside a
# directory, "**.docx" also matches a file committed at the repository root.
exclude_paths:
  - "**.docx"
  - "**/*.docx"
  - "**/*.doc"
  - "**/*.pdf"
  - "**/*.zip"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.ico"

# The same run also logged two analyser failures:
#
#     Failed analysis for pmd     -- No rules found. Maybe you misspelled
#                                    a rule name? (null)
#     Failed analysis for eslint  -- No ESLint configuration found
#
# PMD analyses Java and ESLint analyses JavaScript. This repository has
# neither: its 627 tracked files are 558 .py, 38 .md, and a handful of
# .ps1/.json/.yml/.toml/.txt -- not one .java, .js or .ts. Both tools were
# started for languages that are not here, found nothing to configure and
# failed. Neither failure aborts the run -- it continued for another twenty
# minutes afterwards -- so this is noise, not the cause of the red cross.
#
# The obvious fix does not exist. Codacy's own validator, run locally
# against their 4.0.0 image, shows that "enabled" is not part of either
# schema: a "languages:" entry parses to LanguageConfiguration(extensions)
# and an "engines:" entry to EngineConfiguration(exclude_paths, baseSubDir,
# extraValues). Feeding it "enabled: false" yields three Nones -- the key
# is dropped without a warning, which is exactly how the previous attempt
# to switch Java and JavaScript off did nothing at all. Verified by feeding
# a probe value: the first slot echoed back Glob("**/probe.java"), so the
# field really is exclude_paths and there is no on/off switch to reach.
#
# So the only lever the schema does offer is used instead: give each of the
# three engines an empty file list. Tools whose language is genuinely
# present -- SQLint and tsqllint (.sql), psscriptanalyzer (.ps1),
# remark-lint (.md), hadolint (Dockerfile) -- are left alone.
# pylint is kept for `core/`, `tools/`, `cli/` and switched off for the two test
# trees. Not a taste call — measured 2026-08-05 with our own `.pylintrc`:
#
#   tests/ + project_intelligence/tests/   553 findings, 0 true positives
#   core/ + tools/ + cli/                    2 findings, 2 true positives
#
# 448 of the 553 are one rule, `redefined-outer-name`, firing on pytest's
# fixture injection: a test parameter MUST carry the fixture's name or pytest
# hands it nothing, so the "shadowing" is the only way to request a fixture at
# all. The remaining 105 are the same shape of blindness — `FieldInfo` has no
# `.startswith` (pydantic descriptors resolve at runtime),
# `__dataclass_fields__` "missing" from a dataclass, `Engine` missing from a
# module built by `exec`, and `frozenset.add` inside a `pytest.raises` that
# exists precisely to prove the set is frozen. A suite made of doubles, fakes
# and dynamically built objects is where static inference has least to go on.
#
# The rule itself stays ENABLED, because on real code it earns its place: both
# production hits were genuine and are fixed in this change — a parameter that
# shadowed a same-named function in `core/gateway_consult.py`, so the function
# could not be called inside that body, and a redundant local `import json` in
# `core/replan.py` shadowing the module-level one. Disabling it in `.pylintrc`
# would have thrown those away too; `.pylintrc` also forbids putting
# bug-catching checks on its disable list, and this is one.
#
# `exclude_paths` is the lever because it is the ONLY one this schema offers
# (see the note above: `enabled:` is silently dropped) and the only one remote
# mode honours — `.codacy/cli-config.yaml` says `mode: remote`, where the rule
# set comes from the server and no config file in this repository is read.
engines:
  pylint:
    exclude_paths:
      - "tests/**"
      - "project_intelligence/tests/**"
  pmd:
    exclude_paths:
      - "**"
  pmd-legacy:
    exclude_paths:
      - "**"
  eslint:
    exclude_paths:
      - "**"
