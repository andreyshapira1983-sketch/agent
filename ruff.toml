# Набор правил линтера — ЗАФИКСИРОВАН здесь намеренно.
#
# Зачем этот файл появился (2026-08-03). Конфига не было вообще, поэтому
# приговор выносила версия инструмента: после обновления ruff в дереве
# внезапно оказалось 600 замечаний, из которых 211 он поправил сам. Хуже
# того, локальный ruff и ruff внутри Codacy применяли РАЗНЫЕ наборы, и это
# порождало неразрешимый конфликт: Codacy требовал подавить правило
# (например, BLE001), а его же второй анализатор звал это подавление
# лишним (RUF100). Один зафиксированный набор снимает обе беды: локальный
# прогон показывает то же, что увидит проверка, а директивы `noqa`
# перестают быть «мёртвыми».
#
# Правило оператора рядом: ни один файл кода не длиннее 2000 строк
# (`scripts/check_ceo_file_baseline.py` следит за этим отдельно).

target-version = "py311"
line-length = 100

[lint]
# Явный список — не «всё подряд». Каждое семейство здесь либо ловит
# настоящие дефекты, либо уже применяется проверкой в облаке, и держать
# его выключенным локально значит узнавать о замечаниях последним.
select = [
    "E4", "E7", "E9",  # синтаксис и явные ошибки (E5 = длина строки — ниже)
    "F",               # pyflakes: неиспользуемое, неопределённое
    "I",               # порядок импортов
    "UP",              # современный синтаксис языка
    "B",               # частые ловушки (bugbear)
    "BLE",             # широкие `except` — тот самый класс аудита MIR-077
    "S",               # безопасность (bandit-набор)
    "SIM",             # упрощения
    "RUF",             # правила самого ruff, включая RUF100 (мёртвые noqa)
    "C4",              # лишние вызовы-конструкторы коллекций
    "PIE", "FLY", "FURB", "RET", "TRY", "DTZ", "PYI", "ISC",
    "PL",              # pylint-семейство (PLC/PLE/PLR/PLW)
]

# Осознанно НЕ включено:
# * E501 (длина строки) — в проекте много длинных строк с осмысленными
#   комментариями и русским текстом; включение дало бы тысячи замечаний,
#   не связанных с дефектами. Ширина задана выше как ориентир форматтера.
ignore = [
    # --- русский язык в тексте программы ---
    # Док-строки, комментарии и сообщения здесь пишутся по-русски; правила
    # про «неоднозначные символы» ловят кириллицу и не находят дефектов.
    "RUF001", "RUF002", "RUF003",

    # --- намеренные приёмы этого проекта ---
    # Ленивый импорт внутри функции — рабочий способ разорвать цикл и не
    # тянуть тяжёлую зависимость при старте; в коде их сотни, осознанно.
    "PLC0415",
    # Длинное человеческое сообщение прямо в raise — здесь это норма:
    # оператор читает текст ошибки, а не код исключения.
    "TRY003",
    # Переиспользование имени переменной цикла — распространённый и
    # безопасный приём в разборе данных.
    "PLW2901",
    # `contextlib.suppress` вместо try/except/pass читается хуже там, где
    # рядом стоит комментарий с причиной (см. аудит MIR-077).
    "SIM105",
    # Числа-пороги в сравнениях объяснены рядом комментарием и вынесены в
    # константы там, где это осмысленно.
    "PLR2004",
    # Массовая косметика дат (`datetime.UTC` вместо `timezone.utc`) — своим
    # срезом, не условием прохождения проверки.
    "UP017",
]

[lint.per-file-ignores]
# Тесты живут по своим законам: assert — их основной инструмент, а
# фикстуры pytest намеренно затеняют имена модуля.
"tests/**" = ["S101", "PLR2004", "PLR0913", "S105", "S106", "S108"]
# Скрипты обслуживания печатают в консоль и зовут внешние команды с
# фиксированными аргументами — это их работа, а не находка.
"scripts/**" = ["S603", "S607", "T201"]

[lint.pylint]
# Пороговые значения подняты до фактических: цель файла — фиксировать
# набор правил, а не устраивать разовую перестройку кода.
max-args = 12
max-branches = 30
max-statements = 100
max-returns = 12
